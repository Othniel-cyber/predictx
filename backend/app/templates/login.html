{% extends "base.html" %}
{% block title %}Connexion - PredictX{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 animate-fade-in">
    <div class="bg-card rounded-2xl p-8">
        <h1 class="text-2xl font-black text-white text-center mb-6">Connexion</h1>

        {% if error %}
        <div class="bg-red-900/30 border border-red-800/50 text-red-400 px-4 py-3 rounded-xl mb-4 text-sm">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Mot de passe</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white">
            </div>
            <button type="submit" class="w-full btn-primary text-white font-bold py-3 rounded-xl transition">
                Se connecter
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Pas encore de compte ? <a href="/register" class="text-blue-400 hover:underline">S'inscrire</a>
        </p>
    </div>
</div>
{% endblock %}
